<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Compra d'entrades - La Velada 7</title>
  <link rel="stylesheet" href="css/entrades.css">
</head>
<body>

  <h1>🎟️ Compra d'entrades</h1>

  <div class="card">
    <form id="form-entrades">
     
      <!-- Tria de zona -->
      <div class="form-group">
        <label for="zona">Tria la zona:</label>
        <select id="zona" required>
          <option value="30">Pista (30 €)</option>
          <option value="50">Grada Baixa (50 €)</option>
          <option value="80">VIP Ring (80 €)</option>
        </select>
      </div>

      <!-- Nombre d'entrades (de 1 a 4) -->
      <div class="form-group">
        <label for="num-entrades">Nombre d'entrades (màx 4):</label>
        <input type="number" id="num-entrades" min="1" max="4" value="1" required>
      </div>

      <!-- Nom i cognoms -->
      <div class="form-group">
        <label for="nom">Nom i cognoms:</label>
        <input type="text" id="nom" placeholder="Ex: Joan Garcia" required>
      </div>

      <!-- Correu electrònic -->
      <div class="form-group">
        <label for="email">Correu electrònic:</label>
        <input type="email" id="email" placeholder="nom@exemple.com" required>
      </div>

      <!-- Telèfon -->
      <div class="form-group">
        <label for="telefon">Telèfon:</label>
        <input type="tel" id="telefon" placeholder="600000000" required>
      </div>

      <!-- Data de naixement -->
      <div class="form-group">
        <label for="data-naixement">Data de naixement:</label>
        <input type="date" id="data-naixement" required>
      </div>

      <!-- Acceptació de condicions -->
      <div class="form-group">
        <label>
          <input type="checkbox" id="condicions" required>
          Accepto les condicions de compra
        </label>
      </div>

      <!-- Càlcul del preu total -->
      <div class="price-box">
        <div>Preu Total (inclou 5€ de despeses de gestió):</div>
        <span id="preu-total">35 €</span>
      </div>

      <!-- Botó d'enviament -->
      <button type="submit" class="btn-submit">Confirmar i Comprar</button>

    </form>
  </div>

  <a href="index.html" class="btn-back">Tornar a l'Inici</a>

  <!-- Script per al càlcul i enviament -->
  <script src="js/entrades.js"></script>

</body>
</html>
