<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Formulari de Contacte</title>
</head>
<body>

  <h1>Formulari de Contacte</h1>

  <form>

    <!-- NOM -->
    <label>Nom i cognoms:</label><br>
    <input type="text" required minlength="3" maxlength="50"><br><br>

    <!-- EMAIL -->
    <label>Correu electrònic:</label><br>
    <input type="email" required maxlength="60"><br><br>

    <!-- TELÈFON -->
    <label>Telèfon (9 dígits):</label><br>
    <input type="tel" required maxlength="9" pattern="[0-9]{9}"><br><br>

    <!-- DATA NAIXEMENT -->
    <label>Data de naixement:</label><br>
    <input type="date" required min="1900-01-01" max="2010-12-31"><br><br>

    <!-- OBSERVACIONS -->
    <label>Observacions (màx 200 caràcters):</label><br>
    <textarea required maxlength="200"></textarea><br><br>

    <!-- CHECK -->
    <label>
      <input type="checkbox" required>
      Accepto les condicions
    </label><br><br>

    <button type="submit">Enviar</button>

  </form>

</body>
</html>
