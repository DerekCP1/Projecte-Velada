<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Participa i Premsa - La Velada 7</title>
  <link rel="stylesheet" href="css/participa.css">
</head>
<body>

  <h1>📋 Sol·licituds i Acreditacions</h1>

  <div class="card">
    <form id="form-participa">
      
      <!-- Tipus de sol·licitud -->
      <div class="form-group">
        <label for="tipus">Tipus de sol·licitud:</label>
        <select id="tipus" required>
          <option value="Casting">Casting propera edició</option>
          <option value="Voluntariat / Staff">Voluntariat i Staff</option>
          <option value="Acreditació de premsa">Acreditació de premsa</option>
        </select>
      </div>

      <!-- Nom i cognoms -->
      <div class="form-group">
        <label for="nom">Nom i cognoms:</label>
        <input type="text" id="nom" placeholder="Ex: Marc Soler" required>
      </div>

      <!-- Correu electrònic -->
      <div class="form-group">
        <label for="email">Correu electrònic:</label>
        <input type="email" id="email" placeholder="nom@exemple.com" required>
      </div>

      <!-- Telèfon -->
      <div class="form-group">
        <label for="telefon">Telèfon de contacte:</label>
        <input type="tel" id="telefon" placeholder="600000000" required>
      </div>

      <!-- Mitjà de comunicació o Xarxes Socials -->
      <div class="form-group">
        <label for="mitja">Mitjà de comunicació / Xarxes socials / Perfil:</label>
        <input type="text" id="mitja" placeholder="Ex: @elmeuperfil / Periòdic X / Canal Twitch" required>
      </div>

      <!-- Motivació o descripció -->
      <div class="form-group">
        <label for="missatge">Motiu de la sol·licitud / Observacions:</label>
        <textarea id="missatge" rows="4" placeholder="Explica'ns breument per què vols participar o quin mitjà representes..." required></textarea>
      </div>

      <!-- Acceptació de termes -->
      <div class="form-group">
        <label>
          <input type="checkbox" id="condicions" required>
          Accepto les condicions i el tractament de dades
        </label>
      </div>

      <!-- Botó d'enviament -->
      <button type="submit" class="btn-submit">Enviar Sol·licitud</button>

    </form>
  </div>

  <a href="index.html" class="btn-back">Tornar a l'Inici</a>

  <script src="js/participa.js"></script>

</body>
</html>
